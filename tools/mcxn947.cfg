# NXP FRDM-MCXN947 via the on-board MCU-Link (CMSIS-DAP), core 0 (Cortex-M33).
# OpenOCD 0.12 ships no MCX N target script; this is a minimal one.
source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0x1fc9 0x0143
transport select swd
adapter speed 4000

set _CHIPNAME mcxn947
swd newdap $_CHIPNAME cpu -enable
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu0 cortex_m -dap $_CHIPNAME.dap -ap-num 0
$_CHIPNAME.cpu0 configure -work-area-phys 0x20040000 -work-area-size 0x8000 -work-area-backup 0
cortex_m reset_config sysresetreq
gdb_port disabled
tcl_port disabled
telnet_port disabled

# The core access port only appears after a debug session has been started
# through the NXP Debug Mailbox (AP 2): request a chip reset with resync,
# then send START_DEBUG_SESSION.
proc mcxn947_start_debug_session {} {
    mcxn947.dap apreg 2 0x0 0x21
    sleep 50
    mcxn947.dap apreg 2 0x4 0x7
    sleep 50
}
$_CHIPNAME.cpu0 configure -defer-examine
