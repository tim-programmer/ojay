# NXP FRDM-MCXN947 via the on-board MCU-Link (CMSIS-DAP), core 0 (Cortex-M33).
# OpenOCD 0.12 ships no MCX N target script; this is a minimal one.
source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0x1fc9 0x0143
transport select swd
adapter speed 4000

set _CHIPNAME mcxn947
swd newdap $_CHIPNAME cpu -enable
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu0 cortex_m -dap $_CHIPNAME.dap -ap-num 0
$_CHIPNAME.cpu0 configure -work-area-phys 0x20040000 -work-area-size 0x8000 -work-area-backup 0
cortex_m reset_config sysresetreq
gdb_port disabled
tcl_port disabled
telnet_port disabled

# The core access port only appears after a debug session has been started
# through the NXP Debug Mailbox (AP 2): request a chip reset with resync,
# then send START_DEBUG_SESSION.
proc mcxn947_start_debug_session {} {
    mcxn947.dap apreg 2 0x0 0x21
    sleep 50
    mcxn947.dap apreg 2 0x4 0x7
    sleep 50
}

# The SRAM's ECC is on after reset, and then part of the SRAM holds the ECC
# bits of the rest (NXP's startup code, and ojay's runtime, turn it off). Turn
# it off before loading an image into SRAM.
proc mcxn947_ram_ecc_off {} {
    mww 0x40000E44 0
}

# ---------------------------------------------------------------- flash
# OpenOCD 0.12 has no MCX N flash driver, so flash is programmed with the
# chip's ROM flash API (the bootloader API tree at 0x1303FC00; see NXP's
# fsl_flash.c), called with the core halted: arguments in r0-r3, a stack in
# SRAM and a return address pointing at a BKPT there. SRAM 0x20000000-
# 0x2000FFFF holds the driver's state, the BKPT and the stack, and the data
# being programmed goes to 0x20010000. Everything there is overwritten.

set MCXN947_ROM_CONFIG 0x20000000
set MCXN947_ROM_BKPT   0x20000100
set MCXN947_ROM_STACK  0x20008000
set MCXN947_FLASH_BUFFER 0x20010000
set MCXN947_FLASH_BUFFER_SIZE 0x10000

# Calls a ROM function with up to four arguments; returns its r0 (a status: 0 is success).
proc mcxn947_rom_call {fn {a0 0} {a1 0} {a2 0} {a3 0}} {
    global MCXN947_ROM_BKPT MCXN947_ROM_STACK
    reg r0 $a0; reg r1 $a1; reg r2 $a2; reg r3 $a3
    reg sp $MCXN947_ROM_STACK
    reg lr [expr {$MCXN947_ROM_BKPT | 1}]
    reg pc $fn
    reg xPSR 0x01000000
    resume
    wait_halt 30000
    regexp {0x([0-9a-fA-F]+)} [reg r0] -> v
    return [scan $v %x]
}

# Prepares the ROM flash driver (the core must be halted). Returns its
# function addresses: init, erase, program.
proc mcxn947_flash_init {} {
    global MCXN947_ROM_CONFIG MCXN947_ROM_BKPT
    mcxn947_ram_ecc_off
    set driver [lindex [read_memory 0x1303FC10 32 1] 0]
    set fns [read_memory [expr {$driver + 4}] 32 3]
    mww $MCXN947_ROM_CONFIG 0 64
    mwh $MCXN947_ROM_BKPT 0xBE00
    set status [mcxn947_rom_call [lindex $fns 0] $MCXN947_ROM_CONFIG]
    if {$status != 0} { error "MCX N947 flash_init failed (status $status)" }
    return $fns
}

# Programs a raw binary into flash at `address` (a multiple of 8 KB): erases
# the sectors it covers, then programs it in chunks through SRAM, then
# compares. The file's length must be a multiple of 128 bytes.
proc mcxn947_flash_write {file address} {
    global MCXN947_ROM_CONFIG MCXN947_FLASH_BUFFER MCXN947_FLASH_BUFFER_SIZE
    set fns [mcxn947_flash_init]
    set sector [lindex [read_memory [expr {$MCXN947_ROM_CONFIG + 16}] 32 1] 0]
    set length [file size $file]
    set erase_length [expr {($length + $sector - 1) / $sector * $sector}]
    # The erase key is FOUR_CHAR_CODE('l', 'f', 'e', 'k').
    set status [mcxn947_rom_call [lindex $fns 1] $MCXN947_ROM_CONFIG $address $erase_length 0x6B65666C]
    if {$status != 0} { error "MCX N947 flash_erase failed (status $status)" }
    for {set offset 0} {$offset < $length} {incr offset $MCXN947_FLASH_BUFFER_SIZE} {
        set n [expr {$length - $offset}]
        if {$n > $MCXN947_FLASH_BUFFER_SIZE} { set n $MCXN947_FLASH_BUFFER_SIZE }
        # load_image puts the file at buffer - offset; only [offset, offset + n) is loaded.
        load_image $file [expr {$MCXN947_FLASH_BUFFER - $offset}] bin [expr {$MCXN947_FLASH_BUFFER}] $n
        set status [mcxn947_rom_call [lindex $fns 2] $MCXN947_ROM_CONFIG [expr {$address + $offset}] \
                        $MCXN947_FLASH_BUFFER $n]
        if {$status != 0} { error "MCX N947 flash_program failed at [format 0x%x [expr {$address + $offset}]] (status $status)" }
    }
    verify_image $file $address bin
    echo "mcxn947: programmed $length bytes at [format 0x%x $address]"
}

# (last: a sourced file prints the result of its last command)
$_CHIPNAME.cpu0 configure -defer-examine
